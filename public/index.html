<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoPark KE</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1A16;--panel:#17251F;--panel2:#1E3028;--line:#2A3F35;--text:#EDEAE2;--muted:#9AAFA3;--gold:#D9A441;--gold-dim:#8A6B2E;--green:#4C9A6A;--red:#C1443C;--amber:#E8B84B;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,sans-serif;}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
h1{font-size:17px;margin:0;}
nav{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:10px;}
nav button{background:transparent;border:none;color:var(--muted);padding:8px 13px;border-radius:7px;font-family:inherit;font-size:13px;cursor:pointer;}
nav button.active{background:var(--gold);color:#1A1305;font-weight:600;}
main{max-width:1000px;margin:0 auto;padding:24px 20px;}
.view{display:none;} .view.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;}
h3{color:var(--gold);font-size:14px;margin:0 0 12px;}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;}
input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px;border-radius:7px;font-family:inherit;font-size:14px;}
.btn{background:var(--gold);color:#1A1305;border:none;padding:11px 16px;border-radius:7px;font-weight:600;cursor:pointer;margin-top:14px;width:100%;font-family:inherit;}
.slotgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px;}
.slot{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:'JetBrains Mono';}
.slot.FREE{background:rgba(76,154,106,.18);border:1px solid var(--green);color:var(--green);}
.slot.OCCUPIED{background:rgba(193,68,60,.18);border:1px solid var(--red);color:#E58A83;}
.board{text-align:center;background:#0B140F;border:2px solid var(--gold-dim);border-radius:12px;padding:16px;}
.count{font-family:'JetBrains Mono';font-size:44px;font-weight:700;color:var(--amber);}
.notice{padding:10px;border-radius:7px;font-size:13px;margin-top:10px;}
.notice.ok{background:rgba(76,154,106,.15);border:1px solid var(--green);color:#9CD1AE;}
.notice.err{background:rgba(193,68,60,.15);border:1px solid var(--red);color:#F0A8A2;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;}
.stat .v{font-family:'JetBrains Mono';font-size:22px;color:var(--amber);}
.stat .l{color:var(--muted);font-size:11px;}
</style>
</head>
<body>
<header>
  <h1>AutoPark KE</h1>
  <nav>
    <button data-v="entrance" class="active">Entrance</button>
    <button data-v="entry">Entry Gate</button>
    <button data-v="exit">Exit Gate</button>
    <button data-v="admin">Admin</button>
  </nav>
</header>
<main>

  <section class="view active" id="v-entrance">
    <div class="board"><div class="count" id="freeCount">-</div><div>slots free</div></div>
    <div class="card"><h3>Slot Map</h3><div class="slotgrid" id="slotGrid"></div></div>
  </section>

  <section class="view" id="v-entry">
    <div class="card">
      <h3>Register Arrival</h3>
      <label>Plate</label><input id="entryPlate" placeholder="e.g. KDA 245C">
      <label>Class</label>
      <select id="entryClass"><option value="SALOON">Saloon</option><option value="SUV">SUV</option><option value="MOTORCYCLE">Motorcycle</option><option value="TRUCK">Truck</option></select>
      <button class="btn" id="btnEntry">Register & Open Barrier</button>
      <div id="entryNotice"></div>
    </div>
  </section>

  <section class="view" id="v-exit">
    <div class="card">
      <h3>Exit</h3>
      <label>Vehicle</label>
      <select id="exitPlate"><option value="">— select —</option></select>
      <label>Simulate minutes parked</label>
      <select id="simMin"><option value="0">Use real time</option><option value="20">20</option><option value="90">90</option><option value="200">200</option><option value="300">300</option><option value="400">400</option></select>
      <label>Payment method</label>
      <select id="payMethod"><option value="CASH">Cash</option><option value="MPESA">M-Pesa</option><option value="CARD">Card</option></select>
      <button class="btn" id="btnExit">Calculate Fee & Process Exit</button>
      <div id="exitNotice"></div>
    </div>
  </section>

  <section class="view" id="v-admin">
    <div class="stat-grid">
      <div class="stat"><div class="v" id="statRevenue">-</div><div class="l">REVENUE (KES)</div></div>
      <div class="stat"><div class="v" id="statActive">-</div><div class="l">CURRENTLY PARKED</div></div>
      <div class="stat"><div class="v" id="statClosed">-</div><div class="l">COMPLETED VISITS</div></div>
    </div>
    <button class="btn" id="btnRefresh">Refresh</button>
  </section>

</main>
<script>
const API = ''; // same-origin: server serves this file and the API together

document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('v-'+b.dataset.v).classList.add('active');
    if(b.dataset.v==='entrance') loadBoard();
    if(b.dataset.v==='exit') loadActive();
    if(b.dataset.v==='admin') loadReport();
  });
});

async function loadBoard(){
  const r = await fetch(API+'/api/board'); const d = await r.json();
  document.getElementById('freeCount').textContent = d.free;
  const grid = document.getElementById('slotGrid');
  grid.innerHTML = '';
  d.slots.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'slot '+s.status;
    el.textContent = s.id;
    grid.appendChild(el);
  });
}

document.getElementById('btnEntry').addEventListener('click', async ()=>{
  const plate = document.getElementById('entryPlate').value.trim();
  const vclass = document.getElementById('entryClass').value;
  const notice = document.getElementById('entryNotice');
  const r = await fetch(API+'/api/entry', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'plate='+encodeURIComponent(plate)+'&vclass='+vclass});
  const d = await r.json();
  if(r.ok){
    notice.innerHTML = '<div class="notice ok">Registered '+d.plate+' -> slot '+d.slotId+' (ID '+d.entryId+')</div>';
    document.getElementById('entryPlate').value='';
  } else {
    notice.innerHTML = '<div class="notice err">Lot full — entry denied.</div>';
  }
});

async function loadActive(){
  const r = await fetch(API+'/api/active'); const d = await r.json();
  const sel = document.getElementById('exitPlate');
  sel.innerHTML = '<option value="">— select —</option>';
  d.forEach(v=>{
    const o = document.createElement('option');
    o.value = v.plate; o.textContent = v.plate+' — slot '+v.slotId;
    sel.appendChild(o);
  });
}

document.getElementById('btnExit').addEventListener('click', async ()=>{
  const plate = document.getElementById('exitPlate').value;
  const sim = document.getElementById('simMin').value;
  const method = document.getElementById('payMethod').value;
  const notice = document.getElementById('exitNotice');
  if(!plate){ notice.innerHTML = '<div class="notice err">Select a vehicle.</div>'; return; }
  const r = await fetch(API+'/api/exit', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'plate='+encodeURIComponent(plate)+'&simulateMinutes='+sim+'&method='+method});
  const d = await r.json();
  if(r.ok){
    notice.innerHTML = '<div class="notice ok">Duration '+d.minutes+' min. Fee KES '+d.fee+'. Barrier opened.</div>';
    loadActive(); loadBoard();
  } else {
    notice.innerHTML = '<div class="notice err">Payment failed or vehicle not found.</div>';
  }
});

async function loadReport(){
  const r = await fetch(API+'/api/report'); const d = await r.json();
  document.getElementById('statRevenue').textContent = 'KES '+d.revenue;
  document.getElementById('statActive').textContent = d.active;
  document.getElementById('statClosed').textContent = d.closed;
}
document.getElementById('btnRefresh').addEventListener('click', loadReport);

loadBoard();
</script>
</body>
</html>
